name: Dev — Lint, build, GHCR, tracker

# allocate DeployTrack build → lint → docker build/push GHCR → report dev deploy
# Lint failure (after allocate) reports status: failed for env=dev.
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      fail_lint:
        description: 'Force lint failure (smoke-test failed deploy reporting)'
        required: false
        type: boolean
        default: false

jobs:
  lint:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    outputs:
      build_id: ${{ steps.allocate.outputs.build_id }}
      version: ${{ steps.allocate.outputs.version }}
      build_number: ${{ steps.allocate.outputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Allocate build in DeployTrack
        id: allocate
        env:
          TRACKER_URL: ${{ secrets.TRACKER_URL }}
          TRACKER_TOKEN: ${{ secrets.CICD_WEBHOOK_SECRET }}
          PROJECT_ID: ${{ secrets.TRACKER_PROJECT_ID }}
          IMAGE_REPO: ${{ secrets.IMAGE_REPOSITORY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $body = @{
            project_id       = [int]$env:PROJECT_ID
            commit_sha       = '${{ github.sha }}'
            branch           = 'dev'
            image_repository = $env:IMAGE_REPO
          } | ConvertTo-Json -Compress

          $headers = @{ 'Content-Type' = 'application/json' }
          if ($env:TRACKER_TOKEN) {
            $headers['Authorization'] = "Bearer $($env:TRACKER_TOKEN)"
          }

          $resp = Invoke-RestMethod -Method POST -Uri "$($env:TRACKER_URL)/api/builds" -Headers $headers -Body $body
          $resp | ConvertTo-Json -Depth 6

          $backendImage = [string]$resp.'docker_image'
          if (-not $backendImage -and $resp.build) {
            $backendImage = [string]$resp.build.'docker_image'
          }
          if (-not $backendImage) { throw 'DeployTrack allocate response missing docker_image' }
          $parts = $backendImage -split ':', 2
          $frontendImage = "$($parts[0])-frontend:$($parts[1])"

          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "build_id=$($resp.build.id)`n")
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$($resp.version)`n")
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "build_number=$($resp.build_number)`n")
          # Heredoc avoids Windows runner issues passing colon-containing tags via job outputs.
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "docker_image<<EOF`n")
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "$backendImage`n")
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "EOF`n")
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "frontend_image<<EOF`n")
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "$frontendImage`n")
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "EOF`n")

          Write-Host "Allocated build for lint job outputs:"
          Write-Host "  build_id=$($resp.build.id)"
          Write-Host "  docker_image=$backendImage"
          Write-Host "  frontend_image=$frontendImage"

      - name: Optional intentional lint failure
        if: ${{ inputs.fail_lint == true }}
        run: |
          Write-Error "Intentional lint failure (fail_lint=true)"
          exit 1

      - name: Run repo lint scripts
        run: |
          $ErrorActionPreference = 'Stop'
          $lintDir = Join-Path $PWD 'ci/lint'
          $scripts = @()
          if (Test-Path $lintDir) {
            $scripts = @(Get-ChildItem -Path $lintDir -File -Filter '*.ps1' |
              Where-Object { $_.Name -notlike '*.disabled' } |
              Sort-Object Name)
          }
          if ($scripts.Count -gt 0) {
            foreach ($script in $scripts) {
              Write-Host ('=== Running ' + $script.Name + ' ===')
              & $script.FullName
              if ($LASTEXITCODE -ne 0) { throw ('Lint failed: ' + $script.Name) }
            }
          } else {
            Write-Host 'ci/lint empty or missing - using default backend/frontend checks'
            if (Test-Path backend) {
              Push-Location backend
              try {
                go vet ./...
                if ($LASTEXITCODE -ne 0) { throw 'go vet failed' }
                go test ./... -count=1
                if ($LASTEXITCODE -ne 0) { throw 'go test failed' }
              } finally {
                Pop-Location
              }
            } else {
              Write-Host 'backend/ missing - skipping Go default lint'
            }
            if (Test-Path frontend) {
              Push-Location frontend
              try {
                if (Test-Path package-lock.json) { npm ci } else { npm install }
                $pkg = Get-Content package.json -Raw
                if ($pkg -match '"lint"\s*:') {
                  npm run lint
                  if ($LASTEXITCODE -ne 0) { throw 'npm run lint failed' }
                } else {
                  Write-Host 'No npm lint script; skipping'
                }
              } finally {
                Pop-Location
              }
            } else {
              Write-Host 'frontend/ missing - skipping frontend default lint'
            }
          }

      - name: Report failed dev deployment (lint)
        if: failure() && steps.allocate.outcome == 'success'
        env:
          TRACKER_URL: ${{ secrets.TRACKER_URL }}
          TRACKER_TOKEN: ${{ secrets.CICD_WEBHOOK_SECRET }}
          BUILD_ID: ${{ steps.allocate.outputs.build_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ 'Content-Type' = 'application/json' }
          if ($env:TRACKER_TOKEN) {
            $headers['Authorization'] = "Bearer $($env:TRACKER_TOKEN)"
          }
          $failBody = @{
            build_id    = [int]$env:BUILD_ID
            environment = 'dev'
            status      = 'failed'
            deployed_by = 'github-actions'
          } | ConvertTo-Json -Compress
          try {
            Invoke-RestMethod -Method POST -Uri "$($env:TRACKER_URL)/api/deployments" -Headers $headers -Body $failBody | Out-Null
          } catch {
            Write-Warning "Failed to report failed lint deploy: $_"
          }

  build-push:
    needs: lint
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR credentials from the self-hosted runner machine env (never commit PATs).
      # Set User/Machine env: GHCR_USERNAME, GHCR_TOKEN — then restart the runner.
      - name: Login to GHCR
        run: |
          $ErrorActionPreference = 'Stop'
          $user = [string]$env:GHCR_USERNAME
          $token = [string]$env:GHCR_TOKEN
          if ([string]::IsNullOrWhiteSpace($user)) { throw 'GHCR_USERNAME env var is empty on runner' }
          if ([string]::IsNullOrWhiteSpace($token)) { throw 'GHCR_TOKEN env var is empty on runner' }
          $user = $user.Trim()
          $token = $token.Trim()
          $cfg = Join-Path $env:RUNNER_TEMP 'docker-config'
          New-Item -ItemType Directory -Force -Path $cfg | Out-Null
          Set-Content -Path (Join-Path $cfg 'config.json') -Value '{}'
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "DOCKER_CONFIG=$cfg`n")
          $env:DOCKER_CONFIG = $cfg
          $patFile = Join-Path $env:RUNNER_TEMP 'ghcr.pat'
          [System.IO.File]::WriteAllText($patFile, $token)
          try {
            cmd /c "docker login ghcr.io -u `"$user`" --password-stdin < `"$patFile`""
            if ($LASTEXITCODE -ne 0) { throw 'docker login ghcr.io failed' }
          } finally {
            Remove-Item -Force $patFile -ErrorAction SilentlyContinue
          }

      - name: Build and push images
        id: push
        env:
          BUILD_ID: ${{ needs.lint.outputs.build_id }}
          TRACKER_URL: ${{ secrets.TRACKER_URL }}
          TRACKER_TOKEN: ${{ secrets.CICD_WEBHOOK_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:BUILD_ID) { throw 'BUILD_ID is empty - lint job outputs did not propagate' }

          $headers = @{ 'Content-Type' = 'application/json' }
          if ($env:TRACKER_TOKEN) {
            $headers['Authorization'] = "Bearer $($env:TRACKER_TOKEN)"
          }

          Write-Host "Resolving image tags from DeployTrack for build_id=$($env:BUILD_ID)"
          $build = Invoke-RestMethod -Method GET -Uri "$($env:TRACKER_URL)/api/builds/$($env:BUILD_ID)" -Headers $headers
          $backendImage = [string]$build.'docker_image'
          if (-not $backendImage) { throw "build $($env:BUILD_ID) has no docker_image in DeployTrack" }
          $parts = $backendImage -split ':', 2
          $frontendImage = "$($parts[0])-frontend:$($parts[1])"

          Write-Host "  backend_image=$backendImage"
          Write-Host "  frontend_image=$frontendImage"
          if (-not (Test-Path './backend')) { throw './backend directory not found - check checkout working directory' }
          if (-not (Test-Path './frontend')) { throw './frontend directory not found - check checkout working directory' }

          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "BACKEND_IMAGE=$backendImage`n")
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "FRONTEND_IMAGE=$frontendImage`n")
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "DOCKER_IMAGE=$backendImage`n")

          try {
            docker build -t "$backendImage" ./backend
            if ($LASTEXITCODE -ne 0) { throw 'backend docker build failed' }
            docker build -t "$frontendImage" ./frontend
            if ($LASTEXITCODE -ne 0) { throw 'frontend docker build failed' }
            docker push "$backendImage"
            if ($LASTEXITCODE -ne 0) { throw 'backend docker push failed' }
            docker push "$frontendImage"
            if ($LASTEXITCODE -ne 0) { throw 'frontend docker push failed' }
          } catch {
            $headers = @{ 'Content-Type' = 'application/json' }
            if ($env:TRACKER_TOKEN) { $headers['Authorization'] = "Bearer $($env:TRACKER_TOKEN)" }
            $failBody = @{
              build_id    = [int]$env:BUILD_ID
              environment = 'dev'
              status      = 'failed'
              deployed_by = 'github-actions'
            } | ConvertTo-Json -Compress
            try {
              Invoke-RestMethod -Method POST -Uri "$($env:TRACKER_URL)/api/deployments" -Headers $headers -Body $failBody | Out-Null
            } catch {
              Write-Warning "Failed to report failed deploy: $_"
            }
            throw
          }

      - name: Record successful dev deployment
        env:
          TRACKER_URL: ${{ secrets.TRACKER_URL }}
          TRACKER_TOKEN: ${{ secrets.CICD_WEBHOOK_SECRET }}
          BUILD_ID: ${{ needs.lint.outputs.build_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $body = @{
            build_id    = [int]$env:BUILD_ID
            environment = 'dev'
            status      = 'success'
            deployed_by = 'github-actions'
          } | ConvertTo-Json -Compress

          $headers = @{ 'Content-Type' = 'application/json' }
          if ($env:TRACKER_TOKEN) {
            $headers['Authorization'] = "Bearer $($env:TRACKER_TOKEN)"
          }

          $resp = Invoke-RestMethod -Method POST -Uri "$($env:TRACKER_URL)/api/deployments" -Headers $headers -Body $body
          $resp | ConvertTo-Json -Depth 6
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "DEPLOYMENT_ID=$($resp.id)`n")

      - name: Summary
        env:
          VERSION: ${{ needs.lint.outputs.version }}
          BUILD_NUMBER: ${{ needs.lint.outputs.build_number }}
          BUILD_ID: ${{ needs.lint.outputs.build_id }}
        run: |
          @"
          ### DeployTrack (dev CI)
          - **Version:** $env:VERSION-build$env:BUILD_NUMBER
          - **Backend image:** ``$env:DOCKER_IMAGE``
          - **Frontend image:** ``$env:FRONTEND_IMAGE``
          - **build_id:** $env:BUILD_ID
          - **deployment_id:** $env:DEPLOYMENT_ID
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY
